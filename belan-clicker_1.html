<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>БЕЛАН — рубли на жижку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#17181a;
    --panel:#232527;
    --panel-2:#2b2d30;
    --rust:#e2571c;
    --rust-dim:#a8451c;
    --mustard:#d6a419;
    --jija:#7f9a4a;
    --jija-dim:#5c7136;
    --bone:#ece7de;
    --bone-dim:#a9a49b;
    --warn:#c23b3b;
    --line: rgba(236,231,222,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--asphalt);
    color:var(--bone);
    font-family:'Manrope', sans-serif;
    overflow:hidden;
    user-select:none;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(214,164,25,0.07), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(127,154,74,0.08), transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
    position:relative;
  }

  /* ---------- TOP TAG ---------- */
  .tag-bar{
    display:flex;
    align-items:stretch;
    gap:8px;
    margin-bottom:10px;
  }
  .tag{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    position:relative;
    overflow:hidden;
  }
  .tag::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .tag.money::before{background:var(--rust);}
  .tag.rate::before{background:var(--jija);}
  .tag-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--bone-dim);
    display:block;
    margin-bottom:2px;
  }
  .tag-value{
    font-family:'Oswald', sans-serif;
    font-size:20px;
    font-weight:600;
    color:var(--bone);
    line-height:1.1;
  }
  .tag.money .tag-value{color:var(--rust);}
  .tag.rate .tag-value{color:var(--jija); font-size:16px;}

  /* ---------- MARQUEE PHRASE ---------- */
  .marquee-wrap{
    background:var(--panel-2);
    border:1px dashed var(--line);
    border-radius:4px;
    padding:8px 10px;
    margin-bottom:8px;
    min-height:36px;
    display:flex;
    align-items:center;
  }
  .marquee-wrap .bubble-tail{color:var(--mustard); font-size:15px; margin-right:6px;}
  #phraseText{
    font-size:13px;
    color:var(--bone-dim);
    line-height:1.35;
  }
  #phraseText b{color:var(--mustard); font-weight:800;}

  /* ---------- CLICK ZONE ---------- */
  .click-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:0;
  }
  .rank-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--bone-dim);
    margin-bottom:10px;
  }
  .avatar-outer{
    position:relative;
    width:min(58vw, 250px);
    height:min(58vw, 250px);
  }
  .hazard-ring{
    position:absolute; inset:-8px;
    border-radius:50%;
    background: repeating-conic-gradient(var(--mustard) 0deg 14deg, var(--asphalt) 14deg 28deg);
    opacity:0.85;
    animation: spin 26s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg);} }
  #avatarBtn{
    position:absolute; inset:8px;
    border-radius:50%;
    border:3px solid var(--panel-2);
    background:
      radial-gradient(circle at 35% 30%, #3a3c3f, #1c1d1f 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    transition: transform 0.06s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45), inset 0 0 0 6px rgba(0,0,0,0.25);
  }
  #avatarBtn:active{ transform: scale(0.94); }
  #avatarBtn svg{ width:62%; height:62%; }
  .float-pop{
    position:absolute;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--rust);
    pointer-events:none;
    animation: floatUp 0.9s ease-out forwards;
    white-space:nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  @keyframes floatUp{
    0%{ opacity:1; transform: translate(-50%, 0) scale(1); }
    100%{ opacity:0; transform: translate(-50%, -70px) scale(1.15); }
  }
  .tap-hint{
    margin-top:14px;
    font-size:11px;
    color:var(--bone-dim);
    text-transform:uppercase;
    letter-spacing:0.1em;
  }

  /* ---------- BOTTOM SHEET / SHOP TOGGLE ---------- */
  .sheet-toggle{
    width:100%;
    padding:12px;
    background:var(--rust);
    color:#1a0d05;
    border:none;
    border-radius:6px;
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    margin-top:8px;
    cursor:pointer;
  }
  .sheet-toggle:active{ transform: scale(0.98); }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    max-height:78vh;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index:40;
    display:flex;
    flex-direction:column;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:4px; background:var(--line);
    border-radius:2px; margin:10px auto 4px;
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h2{ font-size:18px; }
  .sheet-close{
    background:none; border:none; color:var(--bone-dim);
    font-size:22px; line-height:1; cursor:pointer; padding:4px 6px;
  }
  .sheet-body{ overflow-y:auto; padding:10px 14px 18px; }

  .upgrade{
    display:flex; align-items:center; gap:10px;
    padding:10px 8px;
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .upgrade:last-child{ border-bottom:none; }
  .upgrade-icon{
    width:42px; height:42px; flex:none;
    border-radius:6px;
    background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .upgrade-info{ flex:1; min-width:0; }
  .upgrade-title{ font-size:13.5px; font-weight:800; color:var(--bone); }
  .upgrade-desc{ font-size:11.5px; color:var(--bone-dim); margin-top:2px; line-height:1.3; }
  .upgrade-lvl{ font-size:10.5px; color:var(--mustard); margin-top:3px; }
  .upgrade-buy{
    flex:none;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--bone);
    border-radius:6px;
    padding:8px 10px;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:600;
    text-align:center;
    min-width:72px;
    cursor:pointer;
  }
  .upgrade-buy .cost{ display:block; color:var(--jija); font-size:12px; }
  .upgrade-buy:disabled{ opacity:0.35; }
  .upgrade-buy:active:not(:disabled){ transform: scale(0.95); }

  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:30;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  /* ---------- EVENT MODAL ---------- */
  .event-modal{
    position:fixed; left:14px; right:14px; top:50%;
    max-width:452px; margin:0 auto;
    transform: translateY(-50%) scale(0.9);
    background:var(--panel);
    border:1px solid var(--warn);
    border-radius:12px;
    padding:18px 16px 16px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .event-modal.show{ opacity:1; transform: translateY(-50%) scale(1); pointer-events:auto; }
  .event-tag{
    display:inline-block;
    background:var(--warn);
    color:#fff;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:3px 8px;
    border-radius:3px;
    margin-bottom:10px;
  }
  .event-title{ font-size:17px; margin-bottom:6px; }
  .event-desc{ font-size:13px; color:var(--bone-dim); line-height:1.4; margin-bottom:14px; }
  .event-btns{ display:flex; gap:8px; }
  .event-btn{
    flex:1;
    padding:12px 8px;
    border-radius:7px;
    border:none;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .event-btn.a{ background:var(--rust); color:#1a0d05; }
  .event-btn.b{ background:var(--panel-2); color:var(--bone); border:1px solid var(--line); }
  .event-btn:active{ transform: scale(0.96); }
  .event-result{
    margin-top:12px;
    font-size:12.5px;
    color:var(--jija);
    min-height:16px;
    font-weight:700;
  }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:50%; bottom:18px; transform:translate(-50%, 20px);
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--bone); font-size:12.5px;
    padding:9px 14px; border-radius:20px;
    opacity:0; transition: all 0.25s ease; z-index:70; max-width:80%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">

  <div class="tag-bar">
    <div class="tag money">
      <span class="tag-label">Рублей на жижку</span>
      <span class="tag-value" id="scoreVal">0</span>
    </div>
    <div class="tag rate">
      <span class="tag-label">В секунду</span>
      <span class="tag-value" id="rateVal">0 ₽/с</span>
    </div>
  </div>

  <div class="marquee-wrap">
    <span class="bubble-tail">💬</span>
    <span id="phraseText">Жми на Белана — он и так уже никуда не бежит.</span>
  </div>

  <div class="click-zone" id="clickZone">
    <div class="rank-label" id="rankLabel">Статус: безработный рыбак</div>
    <div class="avatar-outer">
      <div class="hazard-ring"></div>
      <button id="avatarBtn" aria-label="Белан">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="#d9a24a"/>
          <circle cx="50" cy="56" r="40" fill="#e8b768"/>
          <path d="M14 46 C14 16 86 16 86 46 L86 40 C86 40 74 22 50 22 C26 22 14 40 14 40 Z" fill="#3a2c1c"/>
          <ellipse cx="34" cy="58" rx="5" ry="6" fill="#241a10"/>
          <ellipse cx="66" cy="58" rx="5" ry="6" fill="#241a10"/>
          <path d="M30 76 Q50 90 70 76" stroke="#241a10" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M58 66 L70 62" stroke="#555" stroke-width="4" stroke-linecap="round"/>
          <rect x="68" y="58" width="10" height="6" rx="2" fill="#7f9a4a"/>
          <path d="M18 44 Q14 38 20 34" stroke="#3a2c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="tap-hint" id="tapHint">тыкай сюда</div>
  </div>

  <button class="sheet-toggle" id="openShop">Магазин апгрейдов</button>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="shopSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Магазин апгрейдов</h2>
    <button class="sheet-close" id="closeShop">✕</button>
  </div>
  <div class="sheet-body" id="upgradeList"></div>
</div>

<div class="event-modal" id="eventModal">
  <span class="event-tag">Внезапно</span>
  <div class="event-title" id="eventTitle">—</div>
  <div class="event-desc" id="eventDesc">—</div>
  <div class="event-btns">
    <button class="event-btn a" id="eventBtnA">—</button>
    <button class="event-btn b" id="eventBtnB">—</button>
  </div>
  <div class="event-result" id="eventResult"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
  function haptic(kind){
    if (!tg || !tg.HapticFeedback) return;
    try{
      if (kind==='light') tg.HapticFeedback.impactOccurred('light');
      else if (kind==='medium') tg.HapticFeedback.impactOccurred('medium');
      else if (kind==='success') tg.HapticFeedback.notificationOccurred('success');
      else if (kind==='error') tg.HapticFeedback.notificationOccurred('error');
    }catch(e){}
  }

  // ---------- STATE ----------
  var SAVE_KEY = 'belan_clicker_save_v1';
  var state = {
    score: 0,
    perClick: 1,
    perSecond: 0,
    upgrades: { vape:0, sanya:0, vaz:0, gruzin:0, veniks:0, pyat:0 }
  };

  var UPGRADES = [
    {
      key:'vape', icon:'💨',
      title:'Испарик Pasito II',
      desc:'Новая спираль — тянет злее, клик приносит больше.',
      baseCost:15, growth:1.16,
      effect:function(lvl){ return 1 + lvl; }, // adds to perClick
      apply:function(){ state.perClick += 1; }
    },
    {
      key:'sanya', icon:'🍔',
      title:'Помочь Сане доесть комбо',
      desc:'Саня делится объедками из Пятёрочки — идёт пассивка.',
      baseCost:40, growth:1.19,
      apply:function(){ state.perSecond += 1; }
    },
    {
      key:'vaz', icon:'🚗',
      title:'Починить ВАЗ 2111',
      desc:'Одиннадцатая заводится с трёх раз вместо десяти — рыбалка идёт быстрее.',
      baseCost:120, growth:1.22,
      apply:function(){ state.perClick += 2; state.perSecond += 1; }
    },
    {
      key:'gruzin', icon:'🥊',
      title:'Заткнуть Грузина деньгами',
      desc:'Грузин перестаёт унижать хотя бы на час — работать спокойнее.',
      baseCost:260, growth:1.24,
      apply:function(){ state.perSecond += 3; }
    },
    {
      key:'veniks', icon:'📿',
      title:'Успокоить отца Веника',
      desc:'Веник орёт тише — руки меньше трясутся, клик стабильнее.',
      baseCost:520, growth:1.27,
      apply:function(){ state.perClick += 4; }
    },
    {
      key:'pyat', icon:'🛒',
      title:'Свой человек на кассе в Пятёрочке',
      desc:'Гнилую рыбу теперь пробивают как свежую — доход в фоне растёт.',
      baseCost:1000, growth:1.3,
      apply:function(){ state.perSecond += 8; }
    }
  ];

  var PHRASES = [
    'Сетка порвалась — опять без рыбы, зато с историей.',
    'Веник орёт из кухни: «Белан, где рубли на жижку?!»',
    'Саня доел весь комбо, пока ты вкалывал. Опять.',
    'Грузин: «Э брат, ты вообще жиж ищешь или сети штопаешь?»',
    'Рыба с душком, но покупатель попался без обоняния.',
    'Жижа кончилась ровно на середине заправки подика.',
    'Одиннадцатая опять не заводится — Белан пинает колесо.',
    'Логан жрёт бензин так, будто сам за рулём Саня.',
    'В Пятёрочке снова «случайно» не пробили пакет с чипсами.',
    'Подик пшикнул прямо в лицо — облако жижи как оправдание.',
    'Грузин ржёт: «Белан, ты рыбак или сторож своей лени?»',
    'Веник спалил тайник с подиками под сиденьем одиннадцатой.',
    'Саня: «Брат, подвинься, тут и мне место надо».',
    'Гнилая рыба продана как «фермерская, вчерашний улов».',
    'Жижа с ароматом «арбузный лёд» пахнет скорее бензином.',
    'Белан заново прошивает сеть синей изолентой.',
    'Логан скрипит на кочках громче, чем Веник по утрам.',
    'Охранник Пятёрочки уже знает Белана в лицо. И по имени.'
  ];

  var CLICK_TOAST_CHANCE = 0.35; // chance of extra floating micro-comment
  var CLICK_TOASTS = ['+жижка','мутный улов','это законно, наверное','Саня одобряет','ещё чуть-чуть'];

  var EVENTS = [
    {
      title:'Мусор тормозит на Рено Логан',
      desc:'Инспектор щурится на номер и на твой подик в подстаканнике. Откупиться или рвануть через дворы?',
      a:{label:'Откупиться', act:function(){
        var lose = Math.round(state.score*0.12)+10;
        lose = Math.min(lose, state.score);
        state.score -= lose;
        return {ok:true, msg:'Договорились за '+fmt(lose)+' ₽. Логан поехал дальше, репутация цела.'};
      }},
      b:{label:'Бежать через дворы', act:function(){
        var win = Math.random() < 0.5;
        if (win){
          var gain = Math.round(20 + Math.random()*40);
          state.score += gain;
          return {ok:true, msg:'Ушёл дворами! Ещё и +'+fmt(gain)+' ₽ нашёл на газоне.'};
        } else {
          var lose = Math.round(state.score*0.22)+20;
          lose = Math.min(lose, state.score);
          state.score -= lose;
          return {ok:false, msg:'Логан застрял в яме у гаражей. Штраф — '+fmt(lose)+' ₽.'};
        }
      }}
    },
    {
      title:'Отец Веник спалил с подиком',
      desc:'Веник стоит в дверях с ремнём в одной руке и твоим Pasito II — в другой. Врать или сдаться?',
      a:{label:'Соврать, что это Санин', act:function(){
        var win = Math.random() < 0.45;
        if (win){
          return {ok:true, msg:'Веник поверил и пошёл орать на Саню. Пронесло.'};
        } else {
          var lose = Math.round(state.score*0.18)+15;
          lose = Math.min(lose, state.score);
          state.score -= lose;
          return {ok:false, msg:'Не поверил. Конфисковал подик и кассу — минус '+fmt(lose)+' ₽.'};
        }
      }},
      b:{label:'Признаться сразу', act:function(){
        var lose = Math.round(state.score*0.08)+5;
        lose = Math.min(lose, state.score);
        state.score -= lose;
        return {ok:true, msg:'Веник отчитал, но не отобрал всё. Минус всего '+fmt(lose)+' ₽.'};
      }}
    },
    {
      title:'Грузин увидел твой улов',
      desc:'Грузин держит в руках твою «свежую» рыбу и явно чувствует запах. Предложить долю или послать?',
      a:{label:'Предложить долю', act:function(){
        var lose = Math.round(state.score*0.15)+10;
        lose = Math.min(lose, state.score);
        state.score -= lose;
        return {ok:true, msg:'Грузин заткнулся и взял долю — '+fmt(lose)+' ₽. Мир, дружба, унижение отложено.'};
      }},
      b:{label:'Послать по-простому', act:function(){
        var win = Math.random() < 0.5;
        if (win){
          var gain = Math.round(15 + Math.random()*35);
          state.score += gain;
          return {ok:true, msg:'Грузин обиделся и ушёл ныть Сане. +'+fmt(gain)+' ₽ настроения.'};
        } else {
          var lose = Math.round(state.score*0.1)+8;
          lose = Math.min(lose, state.score);
          state.score -= lose;
          return {ok:false, msg:'Грузин всё разболтал по двору. Клиенты разбежались, минус '+fmt(lose)+' ₽.'};
        }
      }}
    },
    {
      title:'Охранник Пятёрочки прищурился',
      desc:'На кассе снова не пробили пакет чипсов. Охранник идёт в твою сторону. Бросить пакет или идти уверенно?',
      a:{label:'Бросить пакет и уйти', act:function(){
        return {ok:true, msg:'Ушёл налегке. Чипсов жаль, но и так сойдёт.'};
      }},
      b:{label:'Идти уверенно к выходу', act:function(){
        var win = Math.random() < 0.55;
        if (win){
          var gain = Math.round(10 + Math.random()*25);
          state.score += gain;
          return {ok:true, msg:'Прошёл как хозяин жизни. Ещё и мелочь на кассе прихватил — +'+fmt(gain)+' ₽.'};
        } else {
          var lose = Math.round(state.score*0.14)+12;
          lose = Math.min(lose, state.score);
          state.score -= lose;
          return {ok:false, msg:'Остановили у двери. Пришлось «занести» — минус '+fmt(lose)+' ₽.'};
        }
      }}
    },
    {
      title:'Саня требует долю',
      desc:'Саня лежит на диване и тянет руку: «Брат, кинь на комбо, я ж старший». Кинуть или отказать?',
      a:{label:'Кинуть на комбо', act:function(){
        var lose = Math.round(state.score*0.1)+8;
        lose = Math.min(lose, state.score);
        state.score -= lose;
        return {ok:true, msg:'Саня доволен и не встанет с дивана ещё пару часов. Минус '+fmt(lose)+' ₽.'};
      }},
      b:{label:'Отказать', act:function(){
        state.perSecond = Math.max(0, state.perSecond - 1);
        return {ok:false, msg:'Саня обиделся и перестал делиться объедками. Пассивка просела.'};
      }}
    }
  ];

  // ---------- DOM ----------
  var scoreVal = document.getElementById('scoreVal');
  var rateVal = document.getElementById('rateVal');
  var phraseText = document.getElementById('phraseText');
  var avatarBtn = document.getElementById('avatarBtn');
  var clickZone = document.getElementById('clickZone');
  var rankLabel = document.getElementById('rankLabel');
  var tapHint = document.getElementById('tapHint');
  var openShop = document.getElementById('openShop');
  var closeShop = document.getElementById('closeShop');
  var shopSheet = document.getElementById('shopSheet');
  var backdrop = document.getElementById('backdrop');
  var upgradeList = document.getElementById('upgradeList');
  var eventModal = document.getElementById('eventModal');
  var eventTitle = document.getElementById('eventTitle');
  var eventDesc = document.getElementById('eventDesc');
  var eventBtnA = document.getElementById('eventBtnA');
  var eventBtnB = document.getElementById('eventBtnB');
  var eventResult = document.getElementById('eventResult');
  var toastEl = document.getElementById('toast');

  var RANKS = [
    {min:0, label:'Статус: безработный рыбак'},
    {min:150, label:'Статус: сетевязатель на подхвате'},
    {min:600, label:'Статус: гнилой поставщик Пятёрочки'},
    {min:2000, label:'Статус: местный жижевод'},
    {min:6000, label:'Статус: авторитет двора (по мнению Сани)'},
    {min:15000, label:'Статус: легенда района, тень Веника'}
  ];

  function fmt(n){
    n = Math.floor(n);
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object'){
          state.score = parsed.score || 0;
          state.perClick = parsed.perClick || 1;
          state.perSecond = parsed.perSecond || 0;
          state.upgrades = parsed.upgrades || state.upgrades;
        }
      }
    }catch(e){}
  }

  function currentRank(){
    var r = RANKS[0].label;
    for (var i=0;i<RANKS.length;i++){
      if (state.score >= RANKS[i].min) r = RANKS[i].label;
    }
    return r;
  }

  function upgradeCost(u){
    var lvl = state.upgrades[u.key] || 0;
    return Math.round(u.baseCost * Math.pow(u.growth, lvl));
  }

  function renderStats(){
    scoreVal.textContent = fmt(state.score) + ' ₽';
    rateVal.textContent = fmt(state.perSecond) + ' ₽/с';
    rankLabel.textContent = currentRank();
  }

  function renderShop(){
    upgradeList.innerHTML = '';
    UPGRADES.forEach(function(u){
      var lvl = state.upgrades[u.key] || 0;
      var cost = upgradeCost(u);
      var row = document.createElement('div');
      row.className = 'upgrade';

      var icon = document.createElement('div');
      icon.className = 'upgrade-icon';
      icon.textContent = u.icon;

      var info = document.createElement('div');
      info.className = 'upgrade-info';
      info.innerHTML =
        '<div class="upgrade-title">'+u.title+'</div>' +
        '<div class="upgrade-desc">'+u.desc+'</div>' +
        '<div class="upgrade-lvl">Уровень: '+lvl+'</div>';

      var buy = document.createElement('button');
      buy.className = 'upgrade-buy';
      buy.innerHTML = 'Купить<span class="cost">'+fmt(cost)+' ₽</span>';
      buy.disabled = state.score < cost;
      buy.addEventListener('click', function(){
        buyUpgrade(u);
      });

      row.appendChild(icon);
      row.appendChild(info);
      row.appendChild(buy);
      upgradeList.appendChild(row);
    });
  }

  function buyUpgrade(u){
    var cost = upgradeCost(u);
    if (state.score < cost) { haptic('error'); return; }
    state.score -= cost;
    state.upgrades[u.key] = (state.upgrades[u.key] || 0) + 1;
    u.apply();
    haptic('success');
    toast('Куплено: ' + u.title);
    renderStats();
    renderShop();
    save();
  }

  function randomPhrase(){
    return PHRASES[Math.floor(Math.random()*PHRASES.length)];
  }

  var lastPhraseIdx = -1;
  function showPhrase(){
    var p;
    var tries = 0;
    do { p = randomPhrase(); tries++; } while (tries < 5 && p === phraseText.textContent);
    phraseText.textContent = p;
  }

  function spawnFloat(x, y, text, colorVar){
    var el = document.createElement('div');
    el.className = 'float-pop';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if (colorVar) el.style.color = colorVar;
    clickZone.appendChild(el);
    setTimeout(function(){ el.remove(); }, 950);
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  var clickCount = 0;
  function handleClick(evt){
    state.score += state.perClick;
    clickCount++;
    renderStats();
    if (upgradeList.children.length) renderShop();

    var rect = avatarBtn.getBoundingClientRect();
    var appRect = document.getElementById('app').getBoundingClientRect();
    var x, y;
    if (evt.touches && evt.touches[0]){
      x = evt.touches[0].clientX - appRect.left;
      y = evt.touches[0].clientY - appRect.top;
    } else {
      x = rect.left - appRect.left + rect.width/2 + (Math.random()*40-20);
      y = rect.top - appRect.top + rect.height/2;
    }
    var label = '+' + fmt(state.perClick);
    if (Math.random() < CLICK_TOAST_CHANCE){
      label += ' ' + CLICK_TOASTS[Math.floor(Math.random()*CLICK_TOASTS.length)];
    }
    spawnFloat(x, y, label);

    haptic('light');
    tapHint.style.display = 'none';

    if (clickCount % 6 === 0) showPhrase();
    if (clickCount % 22 === 0) maybeFireEvent(true);

    save();
  }

  avatarBtn.addEventListener('click', function(evt){
    handleClick(evt);
  });
  avatarBtn.addEventListener('touchstart', function(evt){
    evt.preventDefault();
    handleClick(evt);
  }, {passive:false});

  // ---------- passive income ----------
  setInterval(function(){
    if (state.perSecond > 0){
      state.score += state.perSecond / 10;
      renderStats();
      if (upgradeList.children.length) renderShop();
    }
  }, 100);

  setInterval(save, 4000);

  // ---------- shop sheet ----------
  function openSheet(){
    renderShop();
    shopSheet.classList.add('open');
    backdrop.classList.add('show');
  }
  function closeSheet(){
    shopSheet.classList.remove('open');
    backdrop.classList.remove('show');
  }
  openShop.addEventListener('click', openSheet);
  closeShop.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', function(){
    closeSheet();
    hideEvent();
  });

  // ---------- random events ----------
  var eventOpen = false;
  function maybeFireEvent(force){
    if (eventOpen) return;
    if (!force && Math.random() > 0.5) return;
    var ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
    fireEvent(ev);
  }

  function fireEvent(ev){
    eventOpen = true;
    eventResult.textContent = '';
    eventTitle.textContent = ev.title;
    eventDesc.textContent = ev.desc;
    eventBtnA.textContent = ev.a.label;
    eventBtnB.textContent = ev.b.label;
    eventBtnA.disabled = false;
    eventBtnB.disabled = false;
    backdrop.classList.add('show');
    eventModal.classList.add('show');

    eventBtnA.onclick = function(){ resolveEvent(ev.a); };
    eventBtnB.onclick = function(){ resolveEvent(ev.b); };
  }

  function resolveEvent(choice){
    eventBtnA.disabled = true;
    eventBtnB.disabled = true;
    var res = choice.act();
    eventResult.style.color = res.ok ? 'var(--jija)' : 'var(--warn)';
    eventResult.textContent = res.msg;
    haptic(res.ok ? 'success' : 'error');
    renderStats();
    save();
    setTimeout(function(){
      hideEvent();
    }, 2200);
  }

  function hideEvent(){
    eventModal.classList.remove('show');
    if (!shopSheet.classList.contains('open')) backdrop.classList.remove('show');
    eventOpen = false;
  }

  // random event on a timer too, regardless of clicks
  setInterval(function(){
    if (!eventOpen && !shopSheet.classList.contains('open')){
      if (Math.random() < 0.12) maybeFireEvent(true);
    }
  }, 15000);

  // ---------- init ----------
  load();
  renderStats();
  if (state.score > 0) tapHint.style.display = 'none';

  window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
